name: Deploy IaaS Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/iaas/**'
      - 'docker/**'
      - 'sample-app-master/**'
      - 'ansible/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'

jobs:
  test:
    name: Run PHP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        working-directory: sample-app-master
        run: |
          # Add PHP repository (Ondrej PPA)
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          
          # Install PHP 8.2 and required extensions
          sudo apt-get install -y php8.2 php8.2-xml php8.2-mbstring php8.2-curl php8.2-zip php8.2-mysql php8.2-sqlite3 php8.2-cli php8.2-common

      - name: Install Composer
        working-directory: sample-app-master
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install Dependencies
        working-directory: sample-app-master
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Test Environment
        working-directory: sample-app-master
        run: |
          # Create .env file with SQLite configuration for tests
          cat > .env << 'EOF'
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost
          
          LOG_CHANNEL=stack
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug
          
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          
          BROADCAST_DRIVER=log
          CACHE_DRIVER=array
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_LIFETIME=120
          
          MEMCACHED_HOST=127.0.0.1
          
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          
          MAIL_MAILER=smtp
          MAIL_HOST=mailpit
          MAIL_PORT=1025
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=
          AWS_USE_PATH_STYLE_ENDPOINT=false
          
          PUSHER_APP_ID=
          PUSHER_APP_KEY=
          PUSHER_APP_SECRET=
          PUSHER_HOST=
          PUSHER_PORT=443
          PUSHER_SCHEME=https
          PUSHER_APP_CLUSTER=mt1
          
          VITE_PUSHER_APP_KEY="${PUSHER_APP_KEY}"
          VITE_PUSHER_HOST="${PUSHER_HOST}"
          VITE_PUSHER_PORT="${PUSHER_PORT}"
          VITE_PUSHER_SCHEME="${PUSHER_SCHEME}"
          VITE_PUSHER_APP_CLUSTER="${PUSHER_APP_CLUSTER}"
          EOF
          
          # Generate APP_KEY
          php artisan key:generate --force

      - name: Run PHPUnit Tests
        working-directory: sample-app-master
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          php artisan test --env=testing || vendor/bin/phpunit

  deploy:
    name: Deploy to IaaS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install ansible

      - name: Azure Login
        id: azure_login
        run: |
          # Install jq for JSON parsing
          sudo apt-get update
          sudo apt-get install -y jq
          
          # Extraire les credentials depuis le secret JSON avec jq
          CREDENTIALS='${{ secrets.AZURE_CREDENTIALS }}'
          
          # Vérifier que le secret existe et n'est pas vide
          if [ -z "$CREDENTIALS" ]; then
            echo "ERROR: AZURE_CREDENTIALS secret is empty or not set"
            exit 1
          fi
          
          # Parser le JSON avec jq
          CLIENT_ID=$(echo "$CREDENTIALS" | jq -r '.clientId // empty')
          CLIENT_SECRET=$(echo "$CREDENTIALS" | jq -r '.clientSecret // empty')
          TENANT_ID=$(echo "$CREDENTIALS" | jq -r '.tenantId // empty')
          SUBSCRIPTION_ID=$(echo "$CREDENTIALS" | jq -r '.subscriptionId // empty')
          
          # Vérifier que tous les champs sont présents
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            echo "ERROR: Missing required credentials in AZURE_CREDENTIALS"
            echo "CLIENT_ID: ${CLIENT_ID:+present}"
            echo "CLIENT_SECRET: ${CLIENT_SECRET:+present}"
            echo "TENANT_ID: ${TENANT_ID:+present}"
            echo "SUBSCRIPTION_ID: ${SUBSCRIPTION_ID:+present}"
            exit 1
          fi
          
          echo "::add-mask::$CLIENT_SECRET"
          
          # Connexion Azure avec Service Principal
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"
          
          # Définir l'abonnement actif
          az account set --subscription "$SUBSCRIPTION_ID"
          
          # Vérifier la connexion
          az account show
          
          # Sauvegarder l'ID d'abonnement pour Terraform
          echo "subscription_id=$SUBSCRIPTION_ID" >> $GITHUB_OUTPUT
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$TENANT_ID" >> $GITHUB_ENV

      - name: Generate SSH Key Pair
        id: ssh_key
        run: |
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N "" -C "github-actions"
          echo "::add-mask::$(cat ~/.ssh/id_rsa)"
          echo "::add-mask::$(cat ~/.ssh/id_rsa.pub)"
          SSH_PUBLIC_KEY=$(cat ~/.ssh/id_rsa.pub)
          SSH_PRIVATE_KEY=$(cat ~/.ssh/id_rsa)
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          echo "$SSH_PUBLIC_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$SSH_PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Format
        working-directory: terraform/iaas
        run: terraform fmt -recursive

      - name: Terraform Init
        working-directory: terraform/iaas
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_login.outputs.subscription_id }}
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/iaas
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_login.outputs.subscription_id }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/iaas
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_login.outputs.subscription_id }}
          TF_VAR_ssh_public_key: ${{ steps.ssh_key.outputs.public_key }}
          TF_VAR_ssh_private_key: ${{ steps.ssh_key.outputs.private_key }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/iaas
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_login.outputs.subscription_id }}
          TF_VAR_ssh_public_key: ${{ steps.ssh_key.outputs.public_key }}
          TF_VAR_ssh_private_key: ${{ steps.ssh_key.outputs.private_key }}
        run: terraform apply -auto-approve tfplan

      - name: Get Public IP
        id: get_ip
        working-directory: terraform/iaas
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Public IP: $PUBLIC_IP"

      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -f -s -o /dev/null -w "%{http_code}" http://${{ steps.get_ip.outputs.public_ip }} | grep -q "200\|302"; then
              echo "Application is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Application not ready yet, waiting 10 seconds..."
            sleep 10
          done
          echo "Application did not become ready in time"
          exit 1

      - name: Run Smoke Tests
        run: |
          PUBLIC_IP="${{ steps.get_ip.outputs.public_ip }}"
          echo "Running smoke tests against http://$PUBLIC_IP"
          
          # Test 1: Homepage returns 200 or 302
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$PUBLIC_IP)
          echo "Homepage HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "ERROR: Homepage returned $HTTP_CODE instead of 200 or 302"
            exit 1
          fi
          
          # Test 2: API endpoint (if exists)
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$PUBLIC_IP/api || echo "000")
          echo "API HTTP status: $API_CODE"
          
          # Test 3: Response time check
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" http://$PUBLIC_IP)
          echo "Response time: ${RESPONSE_TIME}s"
          # Convert to integer (multiply by 1000 to compare as milliseconds)
          RESPONSE_MS=$(echo "$RESPONSE_TIME * 1000" | awk '{printf "%.0f", $1}')
          if [ "$RESPONSE_MS" -gt 5000 ]; then
            echo "WARNING: Response time is slow (${RESPONSE_TIME}s)"
          fi
          
          echo "All smoke tests passed!"

      - name: Cleanup Terraform files
        if: always()
        working-directory: terraform/iaas
        run: |
          rm -f tfplan
          rm -rf .terraform

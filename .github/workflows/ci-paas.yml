name: ci-paas

on:
  push:
    branches: [ "main" ]
    paths:
      - "sample-app-master/**"
      - ".github/workflows/ci-paas.yml"
      - "terraform/paas/**"
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}          # e.g., terracloudacr1234
  AZURE_RG:  ${{ secrets.AZURE_RG }}         # e.g., rg-par_16
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}  # az ad sp create-for-rbac output JSON
  IMAGE_NAME: sample-app

jobs:
  build_push_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Get ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ steps.acr.outputs.LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        working-directory: sample-app-master
        run: |
          docker build -t ${{ steps.acr.outputs.LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }} .
          docker push ${{ steps.acr.outputs.LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: terraform/paas
        run: terraform init

      - name: Terraform Apply (create/update PaaS infra)
        working-directory: terraform/paas
        env:
          TF_VAR_resource_group_name: ${{ env.AZURE_RG }}
          TF_VAR_image_name: ${{ env.IMAGE_NAME }}
          TF_VAR_image_tag: ${{ steps.vars.outputs.TAG }}
        run: terraform apply -auto-approve

      - name: Output webapp URL
        id: tfout
        working-directory: terraform/paas
        run: |
          URL=$(terraform output -raw webapp_url)
          echo "URL=$URL" >> $GITHUB_OUTPUT

      - name: Echo App URL
        run: echo "Deployed: https://${{ steps.tfout.outputs.URL }}"

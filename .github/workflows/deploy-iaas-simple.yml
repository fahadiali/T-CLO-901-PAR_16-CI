name: Deploy IaaS Simple (Quick Update)

on:
  push:
    branches:
      - main
    paths:
      - 'sample-app-master/**'
      - 'docker/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login
        id: azure_login
        run: |
          # Extraire les credentials depuis le secret JSON
          CREDENTIALS='${{ secrets.AZURE_CREDENTIALS }}'
          CLIENT_ID=$(echo "$CREDENTIALS" | grep -o '"clientId"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
          CLIENT_SECRET=$(echo "$CREDENTIALS" | grep -o '"clientSecret"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
          TENANT_ID=$(echo "$CREDENTIALS" | grep -o '"tenantId"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
          SUBSCRIPTION_ID=$(echo "$CREDENTIALS" | grep -o '"subscriptionId"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
          
          echo "::add-mask::$CLIENT_SECRET"
          
          # Connexion Azure avec Service Principal
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"
          
          # Définir l'abonnement actif
          az account set --subscription "$SUBSCRIPTION_ID"
          
          # Sauvegarder l'ID d'abonnement pour Terraform
          echo "subscription_id=$SUBSCRIPTION_ID" >> $GITHUB_OUTPUT
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

      - name: Get Public IP from Terraform
        id: get_ip
        working-directory: terraform/iaas
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_login.outputs.subscription_id }}
        run: |
          # Initialize Terraform if needed
          terraform init -input=false 2>&1 | grep -v "already been initialized" || true
          
          # Get the public IP
          PUBLIC_IP=$(terraform output -raw public_ip 2>/dev/null || echo "")
          
          if [ -z "$PUBLIC_IP" ]; then
            echo "ERROR: Could not retrieve public IP from Terraform state"
            echo "Make sure the IaaS infrastructure has been deployed first with deploy-iaas.yml"
            exit 1
          fi
          
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Public IP: $PUBLIC_IP"

      - name: Generate SSH Key Pair
        id: ssh_key
        run: |
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N "" -C "github-actions-simple"
          echo "::add-mask::$(cat ~/.ssh/id_rsa)"
          SSH_PRIVATE_KEY=$(cat ~/.ssh/id_rsa)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$SSH_PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Add VM to SSH known hosts
        run: |
          PUBLIC_IP="${{ steps.get_ip.outputs.public_ip }}"
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Get SSH Public Key from Terraform State
        id: get_ssh_key
        working-directory: terraform/iaas
        run: |
          # Try to get SSH info from Terraform
          # Note: This assumes the VM was created with deploy-iaas.yml workflow
          # In practice, we'll use the SSH key that was used to create the VM
          # For this simple workflow, we'll need to configure the SSH key as a secret
          echo "Checking SSH key configuration..."

      - name: Setup SSH and Deploy
        run: |
          PUBLIC_IP="${{ steps.get_ip.outputs.public_ip }}"
          SSH_PRIVATE_KEY="${{ steps.ssh_key.outputs.private_key }}"
          
          # Note: This workflow assumes the VM SSH key is configured as a GitHub secret
          # or that we're using the same SSH key that created the VM
          # For a working solution, store the private SSH key used to create the VM in GitHub secrets
          # as IaaS_SSH_PRIVATE_KEY
          
          # Try to use the secret SSH key if available
          if [ -n "${{ secrets.IaaS_SSH_PRIVATE_KEY }}" ]; then
            SSH_KEY_CONTENT="${{ secrets.IaaS_SSH_PRIVATE_KEY }}"
          else
            # Fallback to generated key (won't work unless we update the VM's authorized_keys)
            SSH_KEY_CONTENT="$SSH_PRIVATE_KEY"
            echo "WARNING: Using generated SSH key. This may not work unless the VM's authorized_keys has been updated."
          fi
          
          # Create SSH key file
          mkdir -p ~/.ssh
          echo "$SSH_KEY_CONTENT" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Default username (should match terraform/iaas variables.tf)
          VM_USER="${VM_USER:-azureuser}"
          
          echo "Connecting to VM: $VM_USER@$PUBLIC_IP"
          
          # Test SSH connection
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "$VM_USER@$PUBLIC_IP" \
              "echo 'SSH connection successful'"
          
          # Deploy: git pull (if repo exists) or copy files, then docker compose up
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "$VM_USER@$PUBLIC_IP" << 'ENDSSH'
            set -e
            
            REMOTE_PATH="/opt/sample-app"
            
            # Check if directory exists and has git repo
            if [ -d "$REMOTE_PATH" ] && [ -d "$REMOTE_PATH/.git" ]; then
              echo "Found existing git repository at $REMOTE_PATH"
              cd "$REMOTE_PATH"
              
              # Pull latest changes
              echo "Pulling latest changes..."
              git pull origin main || git pull || echo "Git pull failed, continuing with existing code"
            else
              echo "No git repository found at $REMOTE_PATH, creating directory structure..."
              sudo mkdir -p "$REMOTE_PATH"
              sudo chown -R $USER:$USER "$REMOTE_PATH" || true
            fi
            
            # Check if docker-compose.yml exists
            if [ ! -f "$REMOTE_PATH/../docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found. Please deploy first with deploy-iaas.yml"
              exit 1
            fi
            
            # Navigate to docker-compose location (should be /opt/docker-compose.yml based on ansible deploy)
            cd "$(dirname $(readlink -f $REMOTE_PATH/../docker-compose.yml || echo /opt))"
            
            # Rebuild and restart containers
            echo "Rebuilding and restarting Docker containers..."
            docker compose up -d --build
            
            # Wait a moment for containers to start
            sleep 5
            
            # Check container status
            docker compose ps
            
            echo "Deployment completed!"
ENDSSH

      - name: Wait for application to be ready
        run: |
          PUBLIC_IP="${{ steps.get_ip.outputs.public_ip }}"
          echo "Waiting for application to be ready at http://$PUBLIC_IP..."
          
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$PUBLIC_IP" || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Application is ready!"
              exit 0
            fi
            echo "Attempt $i/15: Application not ready yet (HTTP $HTTP_CODE), waiting 5 seconds..."
            sleep 5
          done
          
          echo "WARNING: Application did not become ready in time, but deployment completed"

      - name: Run Quick Smoke Test
        run: |
          PUBLIC_IP="${{ steps.get_ip.outputs.public_ip }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$PUBLIC_IP")
          echo "Homepage HTTP status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "WARNING: Homepage returned $HTTP_CODE instead of 200 or 302"
          else
            echo "Smoke test passed!"
          fi

